<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lights Out Manor</title>
<!--
  Lights Out Manor — MM2 Values mini game (2026-10-30). Original game: no MM2
  maps, roles or art. Runs inside react-native-webview from a string bundled
  with the app (Code/Manor/manorGameHtml.js, generated by
  scripts/manor/build-game.js — edit THIS file, then `npm run manor:build`).
  No network: system fonts, synthesized sound, everything inline.

  App → game:  window.__MANOR_INIT = { lang, rtl, strings, owned, equipped,
                 played, seenRoles, sound, signedIn, insetsHandled }
                 (written into the page ahead of this script)
               window.__manor.pause() / resume() / back() / proceed() /
                 rewarded(ok) / ticket(roundId) / crate(result, { double }) /
                 setAccount({ signedIn, owned })
  Game → app:  { type: 'ready' | 'round_start' | 'round_end' | 'save' |
                 'haptic' | 'exit' | 'request_next' | 'rewarded_request' |
                 'signin', ... }
  In the app, crates are rolled by the server (functions/manor) and owned
  skins come from it; only a plain browser rolls locally.
  Opened in a plain browser (no app) it still plays: every bridge call has a
  local fallback.
-->
<style>
:root{
  --night:#0a0d16; --panel:#151a2a; --amber:#ffb547; --ghost:#73e6d3; --crimson:#ff5a62; --violet:#b36bff;
  --bone:#f3eadb; --mute:#a99fb8; --line:rgba(243,234,219,.14);
  --display:"Arial Rounded MT Bold","SF Pro Rounded","Nunito",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
  /* Safe-area insets. The app's screen already pads the system bars, so it
     sets these to 0 (INIT.insetsHandled); a plain browser keeps env(). */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#stage{position:relative;height:100%;width:100%;touch-action:none;overflow:hidden}
#game{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
  padding:calc(10px + var(--sat)) max(12px,var(--sar)) 0 max(12px,var(--sal));pointer-events:none}
.hud > *{pointer-events:auto}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(10,13,22,.72);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.chip{display:flex;align-items:center;gap:7px;background:rgba(10,13,22,.72);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:800;font-size:13px;flex:none}
.chip svg{width:20px;height:20px}
.objective{flex:1;min-width:0;text-align:center;font-weight:800;font-size:12.5px;line-height:1.3;text-shadow:0 1px 6px #000;padding-top:3px;pointer-events:none}
.objective b{color:var(--ghost)}
.timer{font-family:var(--display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;background:rgba(10,13,22,.72);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:62px;text-align:center;flex:none;pointer-events:none}
.timer.low{color:var(--crimson);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.roomtag{position:absolute;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:.08em;color:var(--amber);text-transform:uppercase;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.roomtag.show{opacity:.92}
.toast{position:absolute;left:50%;top:calc(94px + var(--sat));transform:translateX(-50%);width:max-content;max-width:86vw;text-align:center;background:rgba(21,26,42,.92);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;font-size:13px;opacity:0;transition:opacity .35s;pointer-events:none}
.toast.show{opacity:1}
.meter{position:absolute;left:50%;bottom:calc(30px + var(--sab));transform:translateX(-50%);width:min(56vw,220px);height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;pointer-events:none}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--crimson))}
.meterlabel{position:absolute;left:50%;bottom:calc(44px + var(--sab));transform:translateX(-50%);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);pointer-events:none;white-space:nowrap}
.joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid rgba(243,234,219,.25);background:rgba(243,234,219,.05);pointer-events:none;opacity:0;transition:opacity .15s}
.joy.on{opacity:1}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,181,71,.55);box-shadow:0 0 18px rgba(255,181,71,.5)}
.action{position:absolute;right:max(18px,calc(var(--sar) + 10px));bottom:calc(22px + var(--sab));min-width:96px;height:56px;padding:0 18px;border-radius:18px;background:var(--crimson);color:#1a0b0d;font-family:var(--display);font-weight:900;font-size:18px;box-shadow:0 6px 0 #9e2a31,0 10px 24px rgba(255,90,98,.35)}
.action:active{transform:translateY(4px);box-shadow:0 2px 0 #9e2a31}
.action[disabled]{opacity:.35;filter:grayscale(.6);pointer-events:none}
.hint{position:absolute;left:max(16px,var(--sal));bottom:calc(16px + var(--sab));font-size:12px;color:var(--mute);font-weight:700;pointer-events:none;max-width:52vw;line-height:1.35}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 30%,rgba(21,26,42,.74),rgba(6,8,14,.95));
  padding:calc(20px + var(--sat)) max(16px,var(--sar)) calc(20px + var(--sab)) max(16px,var(--sal));overflow-y:auto}
.card{width:min(100%,440px);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;margin:auto}
.topbar{position:absolute;left:max(12px,var(--sal));right:max(12px,var(--sar));top:calc(10px + var(--sat));display:flex;justify-content:space-between}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(42px,12vw,62px);line-height:.92;margin:0}
.logo .lit{color:var(--amber);text-shadow:0 0 22px rgba(255,181,71,.55);animation:flicker 4.2s infinite;display:block}
@keyframes flicker{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.25}}
.tag{margin:0;color:var(--mute);font-weight:700;font-size:15px;max-width:32ch}
.big{width:100%;min-height:58px;border-radius:18px;background:var(--amber);color:#2a1700;font-family:var(--display);font-weight:900;font-size:22px;box-shadow:0 6px 0 #b77418,0 14px 30px rgba(255,181,71,.25);padding:8px 14px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b77418}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.role{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px 10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);min-width:0}
.role svg{width:32px;height:32px}
.role strong{font-family:var(--display);font-weight:900;font-size:16px}
.role span{font-size:11.5px;color:var(--mute);line-height:1.3}
.small{font-size:12px;color:var(--mute);line-height:1.4;margin:0;max-width:40ch}
.skinrow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--mute);flex-wrap:wrap;justify-content:center}
.dot{width:16px;height:16px;border-radius:50%}
.pill{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ghost);border:1px solid rgba(115,230,211,.4);border-radius:99px;padding:3px 10px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:0}
.reveal{width:200px;height:236px;border-radius:24px;background:linear-gradient(160deg,#1d2338,#111524);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.reveal svg{width:84px;height:84px}
.reveal strong{font-family:var(--display);font-weight:900;font-size:32px}
.reveal.done{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
.mission{margin:0;font-weight:700;font-size:15.5px;line-height:1.45;max-width:32ch}
.tips{list-style:none;margin:0;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;width:100%}
.tips li::before{content:"★ ";color:var(--amber)}
.result-title{font-family:var(--display);font-weight:900;font-size:clamp(38px,11vw,54px);margin:0;line-height:1}
.win{color:var(--ghost)}.lose{color:var(--crimson)}
.crate{position:relative;width:146px;height:126px;margin-top:6px}
.crate .box{position:absolute;left:0;right:0;bottom:0;height:94px;border-radius:12px;background:repeating-linear-gradient(90deg,#7a4a26 0 28px,#6a3f20 28px 30px);border:4px solid #3e2412;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25)}
.crate .box::after{content:"";position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:8px;background:#f0c45a;border:4px solid #3e2412}
.crate .lid{position:absolute;left:-6px;right:-6px;top:6px;height:32px;border-radius:10px;background:#8a5530;border:4px solid #3e2412;transform-origin:10% 100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.crate .burst{position:absolute;left:50%;top:40%;width:20px;height:20px;margin:-10px;border-radius:50%;opacity:0;transition:transform .6s ease-out,opacity .6s}
.crate.shake{animation:shake .14s linear 8}
.crate.waiting{animation:shake .14s linear infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.crate.open .lid{transform:translateY(-34px) rotate(-28deg)}
.crate.open .burst{animation:burst .9s ease-out forwards}
@keyframes burst{0%{opacity:.9;transform:scale(1)}55%{opacity:.55;transform:scale(11)}100%{opacity:0;transform:scale(13)}}
.prize{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .4s .2s}
.prize.show{opacity:1}
.prize .swatch{width:62px;height:62px;border-radius:50%;border:3px solid rgba(255,255,255,.7)}
.prize .rar{font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.prize .nm{font-family:var(--display);font-weight:900;font-size:26px}
.row{display:flex;gap:10px;width:100%}
.ghostbtn{flex:1;min-height:50px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:15px;padding:6px 12px}
.adbtn{width:100%;min-height:48px;border-radius:14px;border:1px dashed rgba(115,230,211,.55);color:var(--ghost);font-weight:900;font-size:14px;padding:6px 12px}
.odds{font-size:11px;color:var(--mute);margin:0}
.rightbtns{display:flex;gap:8px}
.howcard{width:min(100%,400px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.howstep{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.howpic{width:100%;height:150px;border-radius:18px;background:radial-gradient(120% 120% at 50% 0%,#232b46,#0e1220);display:flex;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden}
.howpic .emo{font-size:64px;line-height:1}
.howpic svg{width:56px;height:56px}
.howpic .beam{position:absolute;left:50%;top:50%;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:150px solid rgba(255,181,71,.18);transform:translate(-50%,-10%) rotate(180deg);transform-origin:50% 0}
.howh{font-family:var(--display);font-weight:900;font-size:24px;margin:0;line-height:1.1}
.howb{font-size:15.5px;line-height:1.45;font-weight:700;color:var(--bone);margin:0;max-width:30ch}
.howroles{display:flex;flex-direction:column;gap:8px;width:100%;text-align:start}
.howroles div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px}
.howroles svg{width:26px;height:26px;flex:none}
.howdots{display:flex;gap:8px}
.howdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.howdots i.on{background:var(--amber)}
.howskip{font-size:13px;font-weight:800;color:var(--mute);padding:6px 12px}
.practice{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#1a1200;background:var(--amber);border-radius:99px;padding:4px 10px}
[dir="rtl"] .howroles{text-align:right}
[hidden]{display:none!important}
[dir="rtl"] .tips{text-align:right}
@media (prefers-reduced-motion:reduce){.logo .lit,.timer.low,.crate.shake,.crate.waiting,.crate.open .burst{animation:none}.reveal.done{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud" id="hud" hidden>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#f3eadb"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div class="chip" id="roleChip"></div>
    <div class="objective" id="objective"></div>
    <div class="timer" id="timer">1:30</div>
  </div>
  <div class="roomtag" id="roomtag"></div>
  <div class="toast" id="toast"></div>
  <div class="meterlabel" id="meterLabel" hidden></div>
  <div class="meter" id="meter" hidden><i></i></div>
  <div class="joy" id="joy"><i></i></div>
  <button class="action" id="action" hidden disabled></button>
  <div class="hint" id="hint" hidden></div>

  <div class="overlay" id="title">
    <div class="topbar">
      <button class="iconbtn" id="exitBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#f3eadb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="rightbtns">
        <button class="iconbtn" id="helpBtn" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="#f3eadb" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.3a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.8v.6"/><circle cx="12" cy="17.2" r=".6" fill="#f3eadb"/></svg></button>
        <button class="iconbtn" id="soundBtn" aria-label="Sound"></button>
      </div>
    </div>
    <div class="card">
      <p class="eyebrow" id="t_eyebrow"></p>
      <h1 class="logo"><span class="lit" id="t_logo1"></span><span id="t_logo2"></span></h1>
      <p class="tag" id="t_tag"></p>
      <button class="big" id="playRandom"></button>
      <div class="roles" id="roleButtons"></div>
      <div class="skinrow" id="skinRow"></div>
      <span class="pill" id="easyPill" hidden></span>
      <p class="small" id="t_controls"></p>
    </div>
  </div>

  <!-- How to play: shown on the first open, and from the ? button. -->
  <div class="overlay" id="howView" hidden>
    <div class="howcard">
      <p class="howstep" id="howStep"></p>
      <div class="howpic" id="howPic"></div>
      <h2 class="howh" id="howH"></h2>
      <p class="howb" id="howB"></p>
      <div class="howroles" id="howRoles" hidden></div>
      <div class="howdots" id="howDots"></div>
      <button class="big" id="howNext"></button>
      <button class="howskip" id="howSkip"></button>
    </div>
  </div>

  <div class="overlay" id="revealView" hidden>
    <div class="card">
      <span class="practice" id="practiceTag" hidden></span>
      <p class="eyebrow" id="t_reveal"></p>
      <div class="reveal" id="revealCard"></div>
      <p class="mission" id="mission"></p>
      <ul class="tips" id="tips" hidden></ul>
      <button class="big" id="startBtn" hidden></button>
    </div>
  </div>

  <div class="overlay" id="pauseView" hidden>
    <div class="card">
      <h2 class="result-title" id="t_paused"></h2>
      <button class="big" id="resumeBtn"></button>
      <button class="ghostbtn" id="quitBtn" style="width:100%"></button>
    </div>
  </div>

  <div class="overlay" id="resultView" hidden>
    <div class="card">
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="mission" id="resultText"></p>
      <div class="crate" id="crate" hidden><div class="burst" id="burst"></div><div class="box"></div><div class="lid"></div></div>
      <div class="prize" id="prize"></div>
      <p class="mission" id="crateNote" hidden></p>
      <button class="big" id="signinBtn" hidden></button>
      <button class="adbtn" id="doubleBtn" hidden></button>
      <p class="odds" id="odds" hidden></p>
      <div class="row">
        <button class="ghostbtn" id="menuBtn"></button>
        <button class="big" id="againBtn" style="flex:1.4"></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
// ───────────────────────── app bridge ─────────────────────────
const INIT = window.__MANOR_INIT || {};
const EN = {
  eyebrow: "Mini game", logo1: "Lights", logo2: "Out Manor",
  tag: "Grab a flashlight. Get a secret role. Trust nobody in the dark.",

  crate_signin: "Sign in to win crates and show your prizes in chat.", signin_btn: "Sign in", signed_in: "You're signed in! Win a round to open a crate.",
  crate_capped: "That's all 6 crates for today. Come back tomorrow for more!", crate_too_fast: "Rounds need to last 20 seconds to win a crate.",
  crate_error: "Couldn't open the crate. Check your internet and play again.", crate_left: "{n} crates left today",
  crate_frame: "New frame in My Cosmetics! Equip it to show it in chat.",
  equip: "Equip skin", equipped: "Equipped", menu: "Menu", again: "Play again",

    for (const k of tokens) if (!k.got) { const d = dist(k, player); if (d < bd) { bd = d; best = k; } }

  }

$("helpBtn").addEventListener("click", () => { SFX.click(); showHow(0); });

function toMenu() { setTension(0); state = "title"; mode = null; player = null; for (const id of ["resultView", "pauseView", "hud", "revealView"]) hide(id); $("action").hidden = true; hide("meter"); hide("meterLabel"); renderSkinRow(); show("title"); }
function pause() { if (state !== "play") return; state = "paused"; show("pauseView"); joy.id = null; $("joy").classList.remove("on"); }
function resume() { if (state !== "paused") return; hide("pauseView"); state = "play"; last = performance.now(); }

// "Play again" asks the app first, which may show an ad at this natural break.
let waitingNext = false;
function requestNext() {
  if (waitingNext) return;
  if (!inApp) { reveal(pick(Object.keys(ROLES))); return; }
  waitingNext = true; post({ type: "request_next" });
  setTimeout(() => { if (waitingNext) proceed(); }, 8000); // never strand the player
}
function proceed() { if (!waitingNext) return; waitingNext = false; reveal(pick(Object.keys(ROLES))); }

// The very first round is an easy practice Runner round: collect glowing tokens.
const firstRole = () => (played === 0 ? "runner" : pick(Object.keys(ROLES)));
$("playRandom").addEventListener("click", () => { SFX.click(); reveal(firstRole()); });
$("againBtn").addEventListener("click", () => { SFX.click(); requestNext(); });
$("menuBtn").addEventListener("click", () => { SFX.click(); toMenu(); });
$("startBtn").addEventListener("click", () => { SFX.click(); startRound(pendingRole); });
$("action").addEventListener("click", accuse);
$("pauseBtn").addEventListener("click", () => { SFX.click(); pause(); });
$("resumeBtn").addEventListener("click", () => { SFX.click(); resume(); });
$("quitBtn").addEventListener("click", () => { SFX.click(); toMenu(); });
$("exitBtn").addEventListener("click", () => post({ type: "exit" }));
$("soundBtn").addEventListener("click", () => { soundOn = !soundOn; renderSound(); saveAll(); if (soundOn) SFX.click(); else musicStop(); });
$("doubleBtn").addEventListener("click", () => { if (doubled) return; $("doubleBtn").disabled = true; post({ type: "rewarded_request", purpose: "double", roundId: lastWinTicket() }); });
$("signinBtn").addEventListener("click", () => { SFX.click(); post({ type: "signin" }); });

// ───────────────────────── input ─────────────────────────
addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k) && state === "play") e.preventDefault();
  keys.add(k);
  if ((k === " " || k === "e") && state === "play") accuse();
  if (k === "Escape") state === "play" ? pause() : resume();
});
addEventListener("keyup", e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
addEventListener("blur", () => { keys.clear(); pause(); });
const stage = $("stage"), joyEl = $("joy");
stage.addEventListener("pointerdown", e => {
  if (state !== "play" || e.target.closest("button") || joy.id !== null) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
  const r = stage.getBoundingClientRect(); joyEl.style.left = (e.clientX - r.left) + "px"; joyEl.style.top = (e.clientY - r.top) + "px"; joyEl.classList.add("on");
  try { stage.setPointerCapture(e.pointerId); } catch (err) { /* older WebViews */ }
});
stage.addEventListener("pointermove", e => {
  if (e.pointerId !== joy.id) return;
  let dx = (e.clientX - joy.ox) / 48, dy = (e.clientY - joy.oy) / 48; const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
  joy.dx = dx; joy.dy = dy; joyEl.firstChild.style.transform = `translate(${dx * 34}px,${dy * 34}px)`;
});
const endJoy = e => { if (e.pointerId !== joy.id) return; joy.id = null; joy.dx = joy.dy = 0; joyEl.classList.remove("on"); joyEl.firstChild.style.transform = ""; };
stage.addEventListener("pointerup", endJoy); stage.addEventListener("pointercancel", endJoy);

// ───────────────────────── app → game ─────────────────────────
window.__manor = {
  pause, resume, proceed, sleep,
  // Read-only snapshot for debugging over WebView DevTools.
  state: () => ({ state, mode, timeLeft: Math.round(timeLeft), player: player && { x: Math.round(player.x), y: Math.round(player.y), face: +player.face.toFixed(2) }, joy: { id: joy.id, dx: +joy.dx.toFixed(2), dy: +joy.dy.toFixed(2) }, keys: [...keys], soundOn, audio: actx ? actx.state : null, music: !!music, tension: music ? +music.tension.toFixed(2) : null }),
  back() { if (!$("howView").hidden) { closeHow(); return; } if (state === "play") pause(); else if (state === "paused") resume(); else if (state === "title") post({ type: "exit" }); else toMenu(); },
  // ok = the ad was watched; the app then asks the server and calls crate(…, { double: true }).
  rewarded(ok) { if (!ok) { $("doubleBtn").disabled = false; return; } doubled = true; $("doubleBtn").hidden = true; if (!inApp) localCrate(false); },
  ticket(id) { ticket = typeof id === "string" ? id : null; },
  crate: crateResult,
  setAccount(a) {
    signedIn = !!(a && a.signedIn);
    if (a && Array.isArray(a.owned)) { owned = a.owned.filter(id => SKINS.some(s => s.id === id)); if (!owned.includes("classic")) owned.unshift("classic"); if (!owned.includes(equipped)) equipped = "classic"; }
    renderSkinRow();
    if (signedIn && !$("signinBtn").hidden) { hide("signinBtn"); note(T("signed_in")); }
  },
};

// Debug builds only (INIT.debug = __DEV__): finish the current round as a win,
// to test crates end to end. The server still checks the ticket and 20 s.
if (INIT.debug) window.__manor.debugWin = () => { if (state === "play") endRound(true, "win", { name: culprit ? culprit.name : "" }); };

// ───────────────────────── loop ─────────────────────────
let last = performance.now();
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); sleep(document.hidden); last = performance.now(); });
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state !== "paused") update(dt);
  render(); requestAnimationFrame(frame);
}
addEventListener("resize", resize);
resize(); texts(); renderSkinRow(); renderSound();
if (!howSeen) showHow(0);
bots = GUESTS.slice(0, 4).map(([n, c, h]) => { const p = pointIn(roomById.hall); return makeChar(n, c, p.x, p.y, h); });
candles = CANDLE_SPOTS.map(([x, y, room]) => ({ x, y, room, lit: true, relight: 0, cool: 10, fl: rand(0, 6) }));
requestAnimationFrame(frame);
// Sound left on last time: start the music now (the app's WebView allows it);
// where a browser blocks audio until a tap, the first touch anywhere starts it.
if (soundOn) audio();
addEventListener("pointerdown", () => { if (soundOn) audio(); }, { capture: true });
post({ type: "ready" });
})();
</script>
</body>
</html>
