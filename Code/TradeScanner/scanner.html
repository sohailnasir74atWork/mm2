<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  MM2 Trade Scanner worker page (2026-11-06, as the Blox and Adopt Me apps).
  Hidden react-native-webview that decodes the picked picture on a canvas
  and runs matcher.js (the slot finder) on its pixels. No network, no UI.
  scripts/trade-scanner/build-html.js inlines matcher.js in place of the
  marker below; the page is published to the CDN with publish_scanner.py
  --app mm2 --html, never bundled in the app.

  RN -> page:  window.tradeScan(id, dataUrl, crop)   crop: CropBox frame, shares of the picture
  page -> RN:  { type: 'ready' } | { type: 'result', id, width, height, slots } | { type: 'error', id, message }
  Slot coordinates are in the cropped frame's own pixels (the same space the
  native text reader and classifyTiles use).
-->
</head>
<body>
<script>
/*__MATCHER__*/
</script>
<script>
(function () {
  var MAX_PIXELS = 4200000;
  // The finder is tuned on trade windows 1280-1700 px wide (2026-11-06,
  // YouTube frames: 93% of trade-side tiles at 1280, 90% at 1920, 76% at
  // 2560): scale every crop into that band. The slot model reads the
  // original pixels, so a big picture loses nothing.
  var MIN_WIDTH = 1280, MAX_WIDTH = 1700;

  function post(msg) { window.ReactNativeWebView.postMessage(JSON.stringify(msg)); }

  window.tradeScan = function (id, dataUrl, crop) {
    var img = new Image();
    img.onload = function () {
      try {
        var c = crop || { x: 0, y: 0, w: 1, h: 1 };
        var sx = Math.round(c.x * img.naturalWidth), sy = Math.round(c.y * img.naturalHeight);
        var w = Math.max(1, Math.round(c.w * img.naturalWidth)), h = Math.max(1, Math.round(c.h * img.naturalHeight));
        var scale = Math.min(Math.sqrt(MAX_PIXELS / (w * h)), w > MAX_WIDTH ? MAX_WIDTH / w : Math.min(2, MIN_WIDTH / w));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, sx, sy, w, h, 0, 0, cw, ch);
        var px = ctx.getImageData(0, 0, cw, ch).data;
        var slots = TradeMatcher.scan(px, cw, ch).map(function (s) {
          return {
            x0: s.x0 / scale, x1: s.x1 / scale,
            top: s.top / scale, nameTop: s.nameTop / scale, nameBottom: s.nameBottom / scale,
            color: s.color,
          };
        });
        post({ type: 'result', id: id, width: w, height: h, slots: slots });
      } catch (e) {
        post({ type: 'error', id: id, message: String(e && e.message || e) });
      }
    };
    img.onerror = function () { post({ type: 'error', id: id, message: 'decode' }); };
    img.src = dataUrl;
  };

  post({ type: 'ready' });
})();
</script>
</body>
</html>
