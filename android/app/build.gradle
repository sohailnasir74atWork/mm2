apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Moved above `android {}` on 2026-09-21. The Crashlytics plugin registers its
// `firebaseCrashlytics {}` extension per build type AT APPLY TIME, so applying
// it after the android block makes that extension unavailable and configuration
// fails with "Could not find method firebaseCrashlytics() ... on
// BuildType$AgpDecorated_Decorated{name=release}". These two lines used to sit
// at the bottom of this file.
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
// Ship only the icon fonts the app renders (react-native-vector-icons copies
// all 19 by default). FontAwesome6 needs Regular AND Solid: icons without the
// `solid` prop that Regular lacks fall back to Solid. Importing another family
// (e.g. MaterialIcons) means adding its .ttf here, or it renders as blanks.
project.ext.vectoricons = [
    iconFontNames: [ "Ionicons.ttf", "FontAwesome.ttf", "FontAwesome6_Regular.ttf", "FontAwesome6_Solid.ttf" ]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")


/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mm2tradesvalues"
    defaultConfig {
        applicationId "com.mm2tradesvalues"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 40
        versionName "1.4.8"
   ndk {
            // x86_64 is required, not optional: without it SoLoader on an
            // x86_64 device (PC emulators, Google Play Games on PC, Chromebooks,
            // WSA) builds its DSO search path from Build.SUPPORTED_ABIS[0] =
            // "x86_64", finds no lib/x86_64 in any split, and the app dies in
            // MainApplication.onCreate with
            // "couldn't find DSO to load: libreactnative.so" — a 100% launch
            // crash for those users. Shipping the split also means they run
            // native code instead of ARM translation. Play serves one ABI per
            // device, so this does not grow anyone's download.
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    packaging {
        jniLibs {
            // 32-bit x86 only: keep it out (no real devices need it). x86_64 is
            // deliberately NOT excluded any more — see the abiFilters comment;
            // excluding it here would strip the split straight back out again.
            excludes += ["**/x86/**"]
        }
    }
    signingConfigs {
        release {
            storeFile file('solanalab.keystore')
            storePassword '798702'
            keyAlias 'solanalabdev'
            keyPassword '798702'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Upload native debug symbols so native crashes (SIGSEGV, SIGABRT
            // from libc.so, Hermes, or any .so) arrive symbolicated. Without
            // this they land in Crashlytics as a wall of bare `at` frames and
            // cannot be diagnosed at all - which is the state this app has
            // been in, since there was no firebaseCrashlytics block here.
            //
            // The task-name segment ("mergeReleaseNativeLibs") is NOT optional:
            // AGP 8 moved intermediates from <type>/out/ to
            // <type>/<taskName>/out/. Pointing at the old layout fails SILENTLY
            // - the plugin uploads nothing and never errors. That exact bug was
            // found in adoptme-jan7 on 2026-09-21; see HANDOFF_2026-09-21.md.
            // After any AGP bump, confirm the directory still exists before
            // trusting a native stack trace.
            //
            // NOTE: uploadCrashlyticsSymbolFileRelease is NOT wired into
            // bundleRelease. Run it explicitly for every shipped build:
            //   ./gradlew :app:bundleRelease
            //   ./gradlew :app:uploadCrashlyticsSymbolFileRelease
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir "build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")


    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
        implementation(platform("com.google.firebase:firebase-bom:33.5.1"))
        implementation("com.google.firebase:firebase-analytics")
        implementation("com.google.firebase:firebase-messaging")
        
    } else {
        implementation jscFlavor
    }
}

